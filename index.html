	<!-- =====================================================
		STARFIELD BACKGROUND + WHITE TEXT — Added by Claude
	====================================================== -->
	<style>
		/* Starfield canvas sits fixed behind everything */
		#starfield-canvas {
			position: fixed;
			top: 0; left: 0;
			width: 100%; height: 100%;
			z-index: -1;
			display: block;
		}

		/* Dark page background so stars are visible */
		body {
			background: #000010;
			color: #fff;
		}

		/* Header title white */
		h1 {
			color: #fff;
		}

		/* Dropdown readable on dark background */
		header select {
			background: rgba(255, 255, 255, 0.12);
			color: #fff;
			border: 1px solid rgba(255, 255, 255, 0.35);
			border-radius: 4px;
			padding: 4px 8px;
		}

		header select option {
			background: #0d0d2b;
			color: #fff;
		}

		/* Main content card — semi-transparent dark panel */
		.main {
			background: rgba(10, 10, 40, 0.72);
			border: 1px solid rgba(255, 255, 255, 0.12);
			backdrop-filter: blur(6px);
			-webkit-backdrop-filter: blur(6px);
			color: #fff;
		}

		/* Image card inside .img-holder */
		.img-holder > div {
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.15);
		}

		/* State name below image */
		.img-holder p {
			color: #e0e0ff;
		}

		/* Info labels (ABBREVIATION:, CAPITOL: etc.) */
		.info-holder strong {
			color: #a0b8ff;
		}

		/* Info values */
		.info-holder span,
		.info-holder p {
			color: #f0f0ff;
		}
	</style>
	<!-- =====================================================
		END — Starfield Background + White Text by Claude
	====================================================== -->
</head>

	<!-- =====================================================
		STARFIELD ANIMATION SCRIPT — Added by Claude
		Draws twinkling stars and occasional shooting stars
		on a full-page fixed canvas behind all content.
	====================================================== -->
	<script>
		(function () {
			const canvas = document.getElementById('starfield-canvas');
			const ctx = canvas.getContext('2d');
			let W, H, stars = [], shootingStars = [];

			function resize() {
				W = canvas.width  = window.innerWidth;
				H = canvas.height = window.innerHeight;
			}

			function makeStar() {
				return {
					x:     Math.random() * W,
					y:     Math.random() * H,
					r:     Math.random() < 0.75 ? 0.8 : Math.random() < 0.6 ? 1.4 : 2,
					phase: Math.random() * Math.PI * 2,
					speed: 0.4 + Math.random() * 1.2
				};
			}

			function makeShooting() {
				return {
					x: Math.random() * W * 0.7,
					y: Math.random() * H * 0.4,
					len: 80 + Math.random() * 120,
					speed: 7 + Math.random() * 6,
					opacity: 1,
					dx: 1,
					dy: 0.55 + Math.random() * 0.3
				};
			}

			function init() {
				resize();
				stars = Array.from({ length: 160 }, makeStar);
			}

			let last = 0, shootTimer = 0;

			function draw(ts) {
				const dt = Math.min((ts - last) / 1000, 0.05);
				last = ts;
				ctx.clearRect(0, 0, W, H);

				/* Twinkling stars */
				stars.forEach(s => {
					s.phase += s.speed * dt;
					const alpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(s.phase));
					ctx.beginPath();
					ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
					ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
					ctx.fill();
				});

				/* Shooting stars */
				shootTimer += dt;
				if (shootTimer > 3.5 + Math.random() * 2) {
					shootingStars.push(makeShooting());
					shootTimer = 0;
				}

				shootingStars = shootingStars.filter(s => s.opacity > 0);
				shootingStars.forEach(s => {
					const tail = s.len * s.opacity;
					const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.dx * tail, s.y - s.dy * tail);
					grad.addColorStop(0, `rgba(255,255,255,${s.opacity.toFixed(2)})`);
					grad.addColorStop(1, 'rgba(255,255,255,0)');
					ctx.beginPath();
					ctx.moveTo(s.x, s.y);
					ctx.lineTo(s.x - s.dx * tail, s.y - s.dy * tail);
					ctx.strokeStyle = grad;
					ctx.lineWidth = 1.5;
					ctx.stroke();
					s.x += s.dx * s.speed;
					s.y += s.dy * s.speed;
					s.opacity -= 0.018;
				});

				requestAnimationFrame(draw);
			}

			window.addEventListener('resize', () => { resize(); stars = Array.from({ length: 160 }, makeStar); });
			init();
			requestAnimationFrame(draw);
		})();
	</script>
	<!-- =====================================================
		END — Starfield Animation by Claude
	====================================================== -->

</body>
